# Smaller bundled SQLite (Orbit only reads other launchers' app.db files): leave out features it never uses.
# (Faster Linux links with mold/lld are enabled by `./build_linux.sh` itself, so plain `cargo build` and CI never depend on them.)
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_DEPRECATED -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_PROGRESS_CALLBACK"
