/* animation toggle (Settings > Appearance) turns every theme animation off */

/* app minimized / unfocused: freeze every running animation */

/* split dual-mode theme cards: left half = Light, right half = Dark */
.th.dual{cursor:default}.th.dual .hv{display:flex}
.th .half{flex:1;min-width:0;border:0;padding:0;cursor:pointer;position:relative;height:133px;display:grid;place-items:center}.th .half+.half{border-left:1px solid var(--line)}
.th .half.pv div{width:82%;padding:11px;gap:9px}.th .half.pv u{width:23px;height:23px;border-radius:9px}
.th .half:hover{filter:brightness(1.08)}.th .half:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.th .half .tag{position:absolute;top:9px;left:9px;font-size:13px;font-weight:700;padding:2px 9px;border-radius:9999px;background:rgba(0,0,0,.4);color:#fff}.th .half.on .tag{background:var(--green);color:var(--on)}
.th .lb .sub{margin-left:auto;color:var(--mut);font-weight:500;font-size:14px}
:root{--green:#1bd96a;--greenh:#3fe583;--red:#ff496e;--orange:#f16436}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Oxygen,Ubuntu,Roboto,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}

.pill i{width:9px;height:9px;border-radius:50%;background:var(--mut)}
/* layout */
#body{flex:1;display:flex;min-height:0}

.sub{color:var(--mut);margin-bottom:21px}

.btn{border:0;border-radius:11px;padding:10px 18px;background:var(--btn);color:var(--head);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:9px;text-decoration:none;white-space:nowrap}

  const th=R.dataset.theme,hc=R.dataset.contrast==="high",need=hc?7:4.5,LT=/light$/.test(th),card=cs.getPropertyValue("--card").trim(),bg=HEX.test(card)?card:LT?"#ffffff":"#26292f",toward=LT?"#000000":"#ffffff";

/* ---------- theme overlays ----------

   Halloween (slowly growing corner webs, pumpkins, swipeable dust) are drawn on one canvas and only run on
   Home and Servers. Glitch also gets random "burst" frames here. Everything stops when animations are off. */
const FX=(()=>{
  const R=document.documentElement,cv=document.createElement("canvas"),cx=cv.getContext("2d");
  cv.id="fx";cv.setAttribute("aria-hidden","true");document.body.appendChild(cv);
  const COL=4,CS=5,WEB_SECS=150,rnd=(a,b)=>a+Math.random()*(b-a);

  let W=0,H=0,mode=null,fam=null,dark=true,raf=0,last=0,t=0,frame=0,flakes=[],puffs=[],ground=new Float32Array(0),cards=[],cardSnow=new Map(),surfs=[],slabs=[],chunks=[],treeS=[],mainR=null,motes=[],wsp=[],webT0=0,glOn=false,glT=0;

  function resize(){const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);

  addEventListener("mousemove",e=>{if(M.in){M.vx=e.clientX-M.x;M.vy=e.clientY-M.y}M.x=e.clientX;M.y=e.clientY;M.in=true});
  addEventListener("mousedown",e=>{if(e.button===0)M.down=true});addEventListener("mouseup",()=>{M.down=false});
  /* Christmas: right-click anywhere to drop a snowball (then the next one, ...) onto a snowman: base, middle, head+face, hat+scarf+arms */
  const gy=x=>H-(ground[Math.max(0,Math.min(ground.length-1,Math.round(x/COL)))]||0);
  addEventListener("contextmenu",e=>{
    if(mode!=="christmas"||blocked()||(e.target.closest&&e.target.closest("input,textarea,select,[contenteditable],.jrow,.inst,.lcard,.scard")))return;
    e.preventDefault();const x=e.clientX,y=e.clientY;if(Math.abs(x-(W-95))<70)return;
    const m=men.find(q=>Math.abs(q.x-x)<34);
    if(m){if(m.s<4&&m.d<=0&&m.ty==null){m.s++;m.ty=y}}else{if(men.length>=6)men.shift();men.push({x,s:1,d:0,dv:0,ty:y})}});
  document.addEventListener("mouseleave",()=>{M.in=false;M.down=false});addEventListener("blur",()=>{M.in=false;M.down=false});

  /* the boxes snow can settle on (instance cards, server cards, Jump in rows, panels), clipped to the scrolling area.
     Each box's snow lives under a stable key, not its DOM node, so it survives Home / Servers redrawing their lists. */
  const SNOWSEL=[".inst",".lcard",".scard",".jrow",".card",".shero",".accbox.open"];
  function refreshCards(){const m=document.getElementById("main");if(!m)return;mainR=m.getBoundingClientRect();cards=[];if(fam!=="christmas")return;
    const cnt={},all=SNOWSEL.map(q=>"#main "+q).join(",");
    document.querySelectorAll(all).forEach(el=>{
      if(el.parentElement&&el.parentElement.closest(all))return;   /* only the outermost box of a nest */
      const b=el.getBoundingClientRect(),sc=el.closest(".dcol,.fcol")||m,sr=sc.getBoundingClientRect();
      if(b.width<60||b.height<20||b.top<Math.max(sr.top,mainR.top)||b.top>Math.min(sr.bottom,mainR.bottom)-6)return;
      const kb=S.page+"|"+SNOWSEL.find(q=>el.matches(q))+"|"+(el.dataset.id||el.dataset.n||"");cnt[kb]=(cnt[kb]||0)+1;
      const key=kb+"|"+cnt[kb],n=Math.ceil(b.width/CS)+1;let st=cardSnow.get(key);
      if(!st){st={sn:new Float32Array(n),cool:0,rt:-99,rl:0,rr:0};cardSnow.set(key,st)}
      else if(st.sn.length!==n){const o=st.sn,ns=new Float32Array(n);for(let i=0;i<n;i++)ns[i]=o[Math.min(o.length-1,Math.round(i*(o.length-1)/Math.max(1,n-1)))]||0;st.sn=ns}
      st.seen=frame;
      if(frame-st.rt>45){const cs=getComputedStyle(el);st.rl=parseFloat(cs.borderTopLeftRadius)||0;st.rr=parseFloat(cs.borderTopRightRadius)||0;st.rt=frame}

      c.y=x=>edgeY(c,x);cards.push(c)});
    if(frame%120===0)for(const[k,v]of cardSnow)if(frame-v.seen>900)cardSnow.delete(k)}

  /* ---- Christmas ---- */
  const flake=init=>({x:rnd(0,W),y:init?rnd(-H,H*.4):rnd(-40,-5),r:rnd(1,3),vy:rnd(.5,1.5),ph:rnd(0,6.28),ix:0,iy:0});
  const addSnow=(a,i,v,max)=>{for(let j=-1;j<=1;j++){const k=i+j;if(k>=0&&k<a.length)a[k]=Math.min(max,a[k]+(j?v*.45:v))}};
  const relax=a=>{for(let i=0;i<a.length-1;i++){const d=a[i]-a[i+1];if(Math.abs(d)>1.4){const m=.18*Math.sign(d);a[i]-=m;a[i+1]+=m}}};
  function puff(x,y,n,vx,vy){for(let i=0;i<n&&puffs.length<240;i++)puffs.push({x,y,vx:vx*.25+rnd(-1.6,1.6),vy:vy*.25+rnd(-2.2,.4),r:rnd(1,2.4),a:1})}
  /* tree tiers as [half width, base y, apex y], top first (the shapes tree() draws) */
  const TIERS=[[40,-104,-154],[52,-62,-118],[62,-14,-78]];
  /* y of a box's top edge at x: follows its rounded corners, then droops past the end (for sliding snow) */
  const edgeY=(c,x)=>{const dl=x-c.l,dr=c.r-x;let y=c.top;
    if(c.rl>0&&dl<c.rl){const q=c.rl-Math.max(0,dl);y=c.top+c.rl-Math.sqrt(Math.max(0,c.rl*c.rl-q*q))}
    if(c.rr>0&&dr<c.rr){const q=c.rr-Math.max(0,dr);y=Math.max(y,c.top+c.rr-Math.sqrt(Math.max(0,c.rr*c.rr-q*q)))}

  function treeSurfs(x,y,s){const tr=TIERS.map(([hw,by,ay],i)=>{const st=treeS[i]||(treeS[i]={sn:new Float32Array(0),cool:0}),h=hw*s,n=Math.ceil(h*2/CS)+1;
      if(st.sn.length!==n)st.sn=new Float32Array(n);
      const ax=y+ay*s,rise=(by-ay)*s;
      return{l:x-h,r:x+h,sn:st.sn,st,max:tmax,i,hw:h,cx:x,by:y+by*s,y:px=>ax+rise*Math.abs(px-x)/h,tree:true}});
    tr.forEach(c=>c.tr=tr);return tr}
  /* the part of a lower tier that sits behind a higher one can't hold snow */
  const covered=(c,x)=>{const yy=c.y(x);for(let q=0;q<c.i;q++){const u=c.tr[q];if(Math.abs(x-u.cx)<u.hw&&yy>u.y(x)&&yy<u.by)return true}return false};

    const gi=Math.max(0,Math.min(ground.length-1,(x/COL)|0));return y>=H-ground[gi]?{gi}:null}
  const spread=(a,i,tot,w,max)=>{const per=tot/(2*w+1);for(let j=-w;j<=w;j++){const q=i+j;if(q>=0&&q<a.length)a[q]=Math.min(max,a[q]+per*(1-Math.abs(j)/(w+1)*.6))}};
  /* a snow layer is drawn as separate runs, only where it has real thickness: no snow = nothing drawn (no stray line) */
  function layer(n,xa,ha,by,edge,dn){let i=0;
    while(i<n){if(ha(i)<.25){i++;continue}let j=i;while(j+1<n&&ha(j+1)>=.25)j++;

/* jump in: recently played instances and worlds, plus the longest played instance's most played worlds */
function jumpItems(worlds){
  const inst=id=>S.instances.find(i=>i.id===id),rows=[];
  const recent=[...S.instances].filter(i=>i.last_played||Date.now()/1000-i.created<604800).sort((a,b)=>(b.last_played||b.created)-(a.last_played||a.created)).slice(0,3);
  recent.forEach(i=>rows.push({k:"i:"+i.id,t:i.last_played||i.created,inst:i}));
  const most=[...S.instances].sort((a,b)=>(b.played||0)-(a.played||0))[0],mostId=most&&most.played?most.id:null;
  const add=(w,tag)=>{const k="w:"+w.iid+"/"+w.folder;const ex=rows.find(r=>r.k===k);if(ex){if(tag)ex.tag=tag;return}if(inst(w.iid))rows.push({k,t:w.last_played,w,tag})};
  worlds.slice(0,4).forEach(w=>add(w));
  worlds.filter(w=>w.iid===mostId).sort((a,b)=>b.played-a.played).slice(0,2).forEach(w=>add(w,"Most played"));
  if(mostId&&!rows.some(r=>r.inst&&r.inst.id===mostId))rows.push({k:"i:"+mostId,t:most.last_played||0,inst:most,tag:"Most played"});
  return rows.sort((a,b)=>b.t-a.t).slice(0,8);
}

    star:`<polygon points="64,18 77,50 111,53 85,76 93,109 64,91 35,109 43,76 17,53 51,50" fill="${fill}"/>`,
    heart:`<path d="M64 106C22 76 22 34 46 32c10-1 17 6 18 14 1-8 8-15 18-14 24 2 24 44-18 74z" fill="${fill}"/>`,
    bolt:`<polygon points="74,16 36,70 60,70 50,112 92,54 68,54" fill="${fill}"/>`,
    leaf:`<path d="M98 26C54 26 28 52 30 94c42 2 70-22 68-68z" fill="${fill}"/><path d="M32 96C52 70 72 52 90 38" stroke="${c(84)}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    flame:`<path d="M64 16c6 26 30 36 28 62-2 20-14 32-28 32S36 98 36 80c0-16 12-22 14-40 8 8 12-4 14-24z" fill="${fill}"/><path d="M64 70c4 10 14 14 12 26-1 8-6 12-12 12s-11-4-12-12c-1-10 8-14 12-26z" fill="${c(78)}"/>`,
    moon:`<path d="M80 22A44 44 0 1 0 106 90 36 36 0 0 1 80 22z" fill="${fill}"/>`};

const svgBlob=(svg,size=256)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(im,0,0,size,size);c.toBlob(b=>b?res(b):rej(new Error("Couldn't make the icon.")),"image/png")};im.onerror=()=>rej(new Error("Couldn't make the icon."));im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});
const fileBlob=(file,size=256)=>new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const w=im.naturalWidth||size,h=im.naturalHeight||size,m=Math.min(w,h),c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,size,size);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("Couldn't read that image.")),"image/png")};

/* Upload / Randomize / Customize, as in the Modrinth app. initial: "gen" (new instance), "keep" (has an icon), "none" (letter tile). */
function iconEditor(host,{name="",url=null,remove=false}={}){
  const initial=url?"keep":remove?"none":"gen";let st=initial,img=null,open=false;
  const g={shape:"cube",hue:28,bg:"dark"};
  const pv=()=>st==="gen"?genSvg(g):st==="img"?`<img src="${esc(img.url)}" alt="">`:st==="keep"?`<img src="${esc(url)}" alt="">`:`<div style="width:100%;height:100%;display:grid;place-items:center;background:${tileColor(name||"?")}">${esc((name[0]||"?").toUpperCase())}</div>`;
  const draw=()=>{
    host.innerHTML=`<div class="ied"><button type="button" class="pv" id="ipv" aria-label="Choose an image" title="Choose an image">${pv()}</button><div class="ib2"><button type="button" class="btn sm" id="iup">${ic("upload","sm")}Upload</button><button type="button" class="btn sm" id="irn">${ic("refresh","sm")}Randomize</button><button type="button" class="btn sm ${open?"out":""}" id="icu">${ic("palette","sm")}Customize</button>${remove&&st!=="none"?`<button type="button" class="btn sm danger" id="irm">${ic("trash","sm")}Remove</button>`:""}</div></div>
    ${open?`<div class="cust"><div class="cl">Shape</div><div class="shp">${Object.keys(SHAPES).map(k=>`<button type="button" data-sh="${k}" title="${SHAPES[k]}" class="${st==="gen"&&g.shape===k?"on":""}">${genSvg({...g,shape:k})}</button>`).join("")}</div>
     <div class="cl">Color</div><div class="cols">${HUES.map(h=>`<button type="button" data-hu="${h}" aria-label="Color" class="${st==="gen"&&g.hue===h?"on":""}" style="background:${h<0?"hsl(0 0% 60%)":`hsl(${h} 75% 55%)`}"></button>`).join("")}</div>
     <div class="cl">Background</div><div class="gap">${Object.entries(BGS).map(([k,v])=>`<button type="button" data-bg="${k}" class="chp ${st==="gen"&&g.bg===k?"on":""}">${v}</button>`).join("")}</div></div>`:""}
    <input type="file" id="ifl" accept="image/*" hidden>`;
    const pick=()=>host.querySelector("#ifl").click();
    host.querySelector("#ipv").onclick=pick;host.querySelector("#iup").onclick=pick;
    host.querySelector("#ifl").onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const b=await fileBlob(f);if(img)URL.revokeObjectURL(img.url);img={blob:b,url:URL.createObjectURL(b)};st="img";draw()}catch(err){toast(err.message,6000)}};
    host.querySelector("#irn").onclick=()=>{g.shape=rnd(Object.keys(SHAPES));g.hue=rnd(HUES.filter(h=>h>=0));g.bg=rnd(["dark","dark","tint"]);st="gen";draw()};
    host.querySelector("#icu").onclick=()=>{open=!open;if(open&&st!=="gen")st="gen";draw()};
    const rm=host.querySelector("#irm");if(rm)rm.onclick=()=>{st="none";open=false;draw()};
    host.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{g.shape=b.dataset.sh;st="gen";draw()});
    host.querySelectorAll("[data-hu]").forEach(b=>b.onclick=()=>{g.hue=+b.dataset.hu;st="gen";draw()});
    host.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{g.bg=b.dataset.bg;st="gen";draw()});
  };
  draw();
  return{
    /* what to do with the icon when the form is saved: {set: Blob} | {reset: true} | null (leave it alone) */
    async result(){if(st==="gen")return{set:await svgBlob(genSvg(g))};if(st==="img")return{set:img.blob};if(st==="none"&&initial==="keep")return{reset:true};return null}
  };
}

/* ---------- download manager ---------- */
const saveTasks=()=>{S.tasks=S.tasks.slice(-60);api("/tasks","POST",{tasks:S.tasks}).catch(()=>{})};
function addTask(title,icon_url,sub){const t={id:Date.now()+""+Math.random().toString(36).slice(2,6),title,icon_url:icon_url||"",sub,status:"running",ts:Date.now()};S.tasks.push(t);saveTasks();topbar();pollTasks();return t}
let taskPoll=null;
function pollTasks(){
  if(taskPoll)return;
  taskPoll=setInterval(async()=>{
    const run=S.tasks.filter(t=>t.status==="running");
    if(!run.length){clearInterval(taskPoll);taskPoll=null;return}
    await Promise.all(run.map(async t=>{try{const r=await api("/progress?id="+encodeURIComponent(t.id));if(t.status==="running"){t.pct=r.pct;t.label=r.label||""}}catch(e){}}));
    if(S.tpOpen)drawTasks();
  },500);
}
function endTask(t,ok,sub){delete t.pct;delete t.label;t.status=ok?"done":"error";if(sub)t.sub=sub;t.ts=Date.now();saveTasks();topbar()}
function toggleTasks(){S.tpOpen=!S.tpOpen;if(!S.tpOpen){const e=$("#tpan");e&&e.remove()}else drawTasks()}
function drawTasks(){
  let el=$("#tpan");if(!el){el=document.createElement("div");el.id="tpan";el.className="tpan";document.body.append(el)}
  const row=t=>`<div class="tit">${tile(t.title,t.icon_url)}<div class="tx"><b>${esc(t.title)}</b><div class="meta ${t.status==="error"?"err":""}">${t.status==="running"?(t.pct!=null?`${Math.round(t.pct*100)}% · `:"")+esc(t.sub)+(t.label?" · "+esc(t.label):""):esc(ago(new Date(+t.ts).toISOString()))+" · "+esc(t.sub)}</div>${t.status==="running"?`<div class="pbar ${t.pct==null?"ind":""}"><i style="width:${t.pct==null?35:Math.round(t.pct*100)}%"></i></div>`:""}</div>${t.status==="running"?"":`<button class="ib" data-td="${esc(t.id)}" aria-label="Remove">${ic("trash","sm")}</button>`}</div>`;
  const run=S.tasks.filter(t=>t.status==="running").reverse(),done=S.tasks.filter(t=>t.status!=="running").reverse();
  el.innerHTML=`<h3>Tasks</h3><div class="tb">${run.length?`<div class="tsec">${ic("chev","sm")}<span class="grow">In progress</span></div>${run.map(row).join("")}`:""}${done.length?`<div class="tsec">${ic("chev","sm")}<span class="grow">Complete</span><button class="lnk" id="tcl">Clear all</button></div>${done.map(row).join("")}`:""}${S.tasks.length?"":'<div class="empty" style="padding:34px">No downloads yet.</div>'}</div>`;
  el.onmousedown=e=>e.stopPropagation();
  el.querySelectorAll("[data-td]").forEach(b=>b.onclick=()=>{S.tasks=S.tasks.filter(t=>t.id!==b.dataset.td);saveTasks();drawTasks()});
  const c=$("#tcl");if(c)c.onclick=()=>{S.tasks=S.tasks.filter(t=>t.status==="running");saveTasks();drawTasks()};
}

/* ---------- project page (in-app) ---------- */
function md(src){
  let t=String(src||"").replace(/\r/g,"");
  t=t.replace(/<a[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi,"[$2]($1)").replace(/<img[^>]*?src=["']([^"']+)["'][^>]*>/gi,"\n![]($1)\n").replace(/<br\s*\/?>/gi,"\n").replace(/<\/?(p|div|center|span|details|summary|b|i|strong|em|u|ul|li|ol|table|tr|td|th|thead|tbody|kbd|sub|sup|font|h[1-6])[^>]*>/gi,"\n").replace(/<!--[\s\S]*?-->/g,"");
  const safe=u=>/^https?:\/\//i.test(u)?u:"#";
  const inl=x=>esc(x).replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(m,a,u)=>`<img src="${safe(u.replace(/&amp;/g,"&"))}" alt="${a}" referrerpolicy="no-referrer" loading="lazy">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,(m,a,u)=>`<a data-ext="${safe(u.replace(/&amp;/g,"&"))}">${a}</a>`)
    .replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/__([^_]+)__/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a data-ext="$2">$2</a>');
  const out=[],L=t.split("\n");let i=0;
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`);continue}
    let m;if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*[-*+]\s+/.test(l)||/^\s*\d+[.)]\s+/.test(l)){const ol=/^\s*\d/.test(l),b=[];while(i<L.length&&(/^\s*[-*+]\s+/.test(L[i])||/^\s*\d+[.)]\s+/.test(L[i])))b.push(`<li>${inl(L[i++].replace(/^\s*([-*+]|\d+[.)])\s+/,""))}</li>`);out.push(`<${ol?"ol":"ul"}>${b.join("")}</${ol?"ol":"ul"}>`);continue}
    if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,""));out.push(`<blockquote>${inl(b.join(" "))}</blockquote>`);continue}
    if(!l.trim()){i++;continue}
    const b=[];while(i<L.length&&L[i].trim()&&!/^(```|#{1,4}\s|\s*[-*+]\s|\s*\d+[.)]\s|>)/.test(L[i]))b.push(L[i++]);
    out.push(b.length?`<p>${inl(b.join("\n")).replace(/\n/g,"<br>")}</p>`:inl(L[i++]))}
  return out.join("");
}

const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e4?(n/1e3).toFixed(1)+"K":Number(n).toLocaleString();

function pageList(cur,last){const s=new Set([1,2,last,cur-1,cur,cur+1]);const a=[...s].filter(n=>n>=1&&n<=last).sort((x,y)=>x-y),o=[];a.forEach((n,i)=>{if(i&&n-a[i-1]>1)o.push("…");o.push(n)});return o}

function pImport(p){
  const s=S.settings;
  const blk=(id,title,d,val,def,isDef)=>`<h3>${title}</h3><div class="d">${d}</div><div class="path"><input type="text" id="${id}" value="${esc(val)}" spellcheck="false" aria-label="${title} folder"><button class="btn" data-b="${id}">${ic("folder","sm")}Browse</button></div>
   <div class="note">${isDef?"This is the default location.":`Default: <span style="user-select:all">${esc(def)}</span>`}</div><div class="gap" style="margin:14px 0 32px"><button class="btn brand" data-sv="${id}" disabled>Save folder</button>${isDef?"":`<button class="btn" data-rs="${id}">Reset to default</button>`}</div>`;
  p.innerHTML=blk("md","Modrinth App","Where the Modrinth App keeps its profiles (the <code>profiles</code> folder). Used by Create instance > Import instance.",s.mr_dir,s.mr_default,s.mr_is_default)+
   blk("cd","CurseForge app","The CurseForge app's Minecraft folder (the one that holds <code>Instances</code>).",s.cfa_dir,s.cfa_default,s.cfa_is_default);
  const keys={md:["modrinth_dir",s.mr_dir],cd:["curseforge_dir",s.cfa_dir]};
  const save=async(id,v)=>{try{S.settings=await api("/settings","POST",{[keys[id][0]]:v});toast("Saved");pImport(p)}catch(e){toast(e.message,6000)}};
  p.querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{const id=b.dataset.b;try{const r=await api("/browse","POST",{start:$("#"+id).value});if(r.path){$("#"+id).value=r.path;p.querySelector(`[data-sv=${id}]`).disabled=false}}catch(e){toast(e.message,5000)}});
  p.querySelectorAll("input[type=text]").forEach(i=>i.oninput=()=>{p.querySelector(`[data-sv=${i.id}]`).disabled=!i.value.trim()||i.value.trim()===keys[i.id][1]});
  p.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>save(b.dataset.sv,$("#"+b.dataset.sv).value.trim()));
  p.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>save(b.dataset.rs,""));
}
async function startUpdate(){
  if(S.updBusy||!S.orbUpd)return;
  let busy=false;try{busy=Object.keys((await api("/launch-status")).running||{}).length>0}catch(e){}
  const notes=(S.orbUpd.notes||"").split("\n").slice(0,10).join("\n");
  if(!confirm("Update Orbit to "+S.orbUpd.latest+"?"+(notes?"\n\n"+notes:"")+"\n\nOrbit will close, install the update and open again by itself."+(busy?"\n\nA game is running; it will be closed too. Save your world first.":"")))return;
  S.updBusy=true;topbar();
  try{await api("/update/install","POST",{})}catch(e){S.updBusy=false;topbar();toast(e.message,8000)}
}
const WHATS_NEW={"0.3.5":["Halloween: spiders now walk across the corner webs (they run from your mouse).","Snow settings only show for Christmas themes, with simple + and \u2212 buttons.","A guided tour for first-time users (replay it from Settings \u2192 About).","Animations pause on low battery (Settings \u2192 Appearance).","Pin your favourite instances with the star in Library."]};
function whatsNew(v){
  try{const seen=UF().seen_ver,n=WHATS_NEW[v];if(!v||seen===v)return;
    if(!n){ufSet({seen_ver:v});return}
    if(ov().childElementCount)return;   /* another dialog is open: try again next launch */
    ufSet({seen_ver:v});
    if(!seen&&!UF().welcome)return;
    openOver(`<div class="modal-bg"><div class="modal"><h2>What's new in Orbit ${esc(v)}</h2><ul style="margin:11px 0 0 21px;padding:0;line-height:1.7">${n.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="gap" style="justify-content:flex-end;margin-top:18px"><button class="btn brand" id="wnx">Got it</button></div></div></div>`);
    $("#wnx").onclick=closeOver}catch(e){}}
async function checkUpdate(quiet){
  try{
    const i=await api("/update/info");
    whatsNew(i.version);
    if(i.last_error)toast("The last update didn't finish; the old version was kept. "+i.last_error,12000);
    if(!i.updater)return null;
    const r=await api("/update/check","POST",{});
    S.orbUpd=r.available?r:null;topbar();return r;
  }catch(e){if(!quiet)throw e;return null}
}
function pAbout(p){
  p.innerHTML=`<h3>Orbit</h3><div class="d">An unofficial, Modrinth-style instance and content manager for Modrinth and CurseForge. Not affiliated with Modrinth, CurseForge or Mojang. Everything stays on this computer.</div><div class="note">Settings file and default instances live in your Orbit app-data folder.</div>
  <h3 style="margin-top:25px">Welcome tour</h3><div class="d">A short guided tour of the main parts of Orbit.</div><div class="gap" style="justify-content:flex-start"><button class="btn sm" id="tourb">Replay the tour</button></div>
  <h3 style="margin-top:25px">Updates</h3><div class="d" id="upv">Checking this version...</div>
  <div class="gap" style="justify-content:flex-start;margin-top:9px"><button class="btn brand" id="upc">${ic("refresh","sm")}Check for updates</button><button class="btn" id="upi" style="display:none">${ic("dl","sm")}Update now</button></div>
  <div class="note" id="ups" style="margin-top:11px;display:none"></div>`;
  $("#tourb").onclick=()=>welcome(true);
  const msg=(t,err)=>{const e=$("#ups");e.style.display=t?"":"none";e.textContent=t||"";e.style.whiteSpace="pre-wrap";e.style.color=err?"var(--red,#ff6b6b)":""};
  api("/update/info").then(i=>{
    $("#upv").textContent="Version "+i.version+(i.updater?"":" · updates aren't available in this install (orbit-updater is missing)");
    if(!i.updater)$("#upc").disabled=true;
    if(i.last_error)msg("The last update didn't finish, and the old version was kept:\n"+i.last_error,true);
  }).catch(()=>{$("#upv").textContent=""});
  $("#upc").onclick=async()=>{
    const b=$("#upc");b.disabled=true;$("#upi").style.display="none";msg("");const old=b.innerHTML;b.innerHTML='<span class="spin"></span>Checking...';
    try{
      const r=await checkUpdate(false);
      if(r&&r.available){
        msg("Orbit "+r.latest+" is available (you have "+r.current+")."+(r.notes?"\n\n"+r.notes.split("\n").slice(0,12).join("\n"):""));
        $("#upi").style.display="";
      }else if(r)msg("Orbit is up to date ("+r.current+").");
    }catch(e){msg(e.message,true)}
    b.innerHTML=old;b.disabled=false;
  };
  $("#upi").onclick=()=>startUpdate();
}

/* First run: a guided tour. Each step spotlights a part of the window and says what it does; the last step picks a look.
   Shown once; Settings > Appearance can replay it. */
function welcome(force){
  if(!force&&UF().welcome)return;if(!UF().welcome)ufSet({welcome:true});
  if(document.getElementById("tour"))return;
  const L=[{t:"Welcome to Orbit",d:"Let's take a quick tour of where everything is. It takes about half a minute, and Esc skips it."},
    {q:'.nb[data-p="home"]',t:"Home",d:"Your recent instances and worlds show up here with Play buttons, so you can jump straight back into the game."},
    {q:"#plus",t:"Create an instance",d:"An instance is a separate Minecraft setup with its own version, mods and worlds. Create one here, or import one you already have."},
    {q:'.nb[data-p="browse"]',t:"Discover content",d:"Find mods, modpacks, shaders and resource packs from Modrinth and CurseForge and install them in a click."},
    {q:'.nb[data-p="servers"]',t:"Servers",d:"Set up and manage your Minecraft servers."},
    {q:'.nb[data-p="shots"]',t:"Screenshots",d:"Browse the screenshots you've taken in the game."},
    {q:"#dlm",t:"Downloads",d:"Game files, mods and updates show their progress here while they download."},
    {t:"Staying up to date",d:"When a new version of Orbit is out, an Update available button appears at the top of the window. Click it and Orbit updates itself. You can also check any time in Settings \u2192 About, and a short What's new note shows after each update."},
    {q:"#gear",t:"Settings",d:"Themes and animations, storage (including importing folders and TLauncher), launch options and your account. You can replay this tour from About."},
    {t:"You're all set",fin:true,d:"That's the tour. Ready to play? Start with one of these, or just close this and look around."}
  ].filter(x=>!x.q||document.querySelector(x.q));
  let i=0;const root=document.createElement("div");root.id="tour";document.body.appendChild(root);
  const end=()=>{root.remove();document.removeEventListener("keydown",key,true);removeEventListener("resize",draw)};
  const draw=()=>{
    const x=L[i],el=x.q&&document.querySelector(x.q),r=el&&el.getBoundingClientRect(),last=i===L.length-1;
    root.innerHTML=`<div class="tcov ${r?"":"dim"}"></div>${r?`<div class="tspot" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>`:""}
    <div class="tcard ${r?"":"mid"}" role="dialog" aria-label="Orbit tour"><h3>${x.t}</h3><div class="note" style="margin:0">${x.d}</div>
    ${x.fin?`<div class="gap" style="flex-wrap:wrap;margin-top:14px;justify-content:flex-start"><button class="btn" id="ta1">${ic("plus","sm")}Create an instance</button><button class="btn" id="ta2">${ic("compass","sm")}Discover content</button></div>`:""}
    <div class="tf"><span class="meta">${i+1} / ${L.length}</span><span class="grow"></span>${last?"":`<button class="btn sm" id="tsk">Skip</button>`}${i?`<button class="btn sm" id="tbk">Back</button>`:""}<button class="btn sm brand" id="tnx">${last?"Done":i?"Next":"Start tour"}</button></div></div>`;
    const c=root.querySelector(".tcard");
    if(r){if(r.left<120){c.style.left=(r.right+18)+"px";c.style.top=Math.max(12,Math.min(innerHeight-c.offsetHeight-12,r.top-8))+"px"}
      else{c.style.top=(r.bottom+18)+"px";c.style.left=Math.max(12,Math.min(innerWidth-c.offsetWidth-12,r.right-c.offsetWidth))+"px"}}
    $("#tnx").onclick=()=>last?end():(i++,draw());const bk=$("#tbk");if(bk)bk.onclick=()=>{i--;draw()};const sk=$("#tsk");if(sk)sk.onclick=end;
    const a1=$("#ta1"),a2=$("#ta2");if(a1)a1.onclick=()=>{end();createModal()};if(a2)a2.onclick=()=>{end();go("browse")};
    $("#tnx").focus()};
  const key=e=>{if(e.key==="Escape"){e.stopPropagation();end()}else if(e.key==="ArrowRight"&&i<L.length-1){i++;draw()}else if(e.key==="ArrowLeft"&&i>0){i--;draw()}};
  document.addEventListener("keydown",key,true);addEventListener("resize",draw);draw()}

(async()=>{try{S.tasks=(await api("/tasks")).tasks.map(t=>t.status==="running"?{...t,status:"error",sub:"Interrupted"}:t)}catch(e){}try{S.settings=await api("/settings");applyLook()}catch(e){}reportTz();setInterval(reportTz,15*60*1000);load("home");setTimeout(welcome,600);pollRun();checkUpdate(true);setInterval(()=>checkUpdate(true),6*60*60*1000)})();
</script></body></html>
