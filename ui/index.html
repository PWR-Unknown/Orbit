function shList(){
  const q=S.sh.q.trim().toLowerCase();

  return l.sort((a,b)=>S.sh.sort==="new"?b.t-a.t:a.t-b.t);
}
function shDraw(){
  const l=shList(),el=$("#shl");if(!el)return;
  if(!l.length){el.innerHTML=`<div class="note" style="padding:30px 0">${S.sh.all.length?"No screenshots match.":"No screenshots yet. Press F2 in the game to take one and it will show up here."}</div>`;return}
  const groups=new Map();
  l.forEach(x=>{const k=S.sh.group==="inst"?x.inst:shDate(x.t);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});

function shView(l,n){

function pollRun(){
  if(pollT)return;
  const tick=async()=>{try{
    const r=(await api("/launch-status")).running;let finished=false;
    for(const id of Object.keys(S.run)){if(!r[id]&&["installing","running"].includes(S.run[id].status)){
      const s=await api(`/instances/${id}/status`);S.run[id]=s;finished=true;if(s.status==="error")toast(s.error,14000)}}
    for(const id in r)S.run[id]=r[id];
    updateRunUI();
    if(S.page==="inst"&&S.itab==="logs"&&S.inst&&r[S.inst])loadLog();
    if(finished&&["home","lib","inst"].includes(S.page)){await load(S.page,S.inst)}
    if(!Object.keys(r).length){clearInterval(pollT);pollT=null}
  }catch(e){}};
  pollT=setInterval(tick,1000);tick();
}

    $("#ma2").onclick=e=>{e.preventDefault();openUrl("https://aka.ms/AppRegInfo")};
    const go=async()=>{try{S.settings=await api("/settings","POST",{ms_client_id:$("#mcid").value});if(!S.settings.ms_client_id)throw new Error("Paste the application ID first.");start()}catch(e){toast(e.message,6000)}};
    $("#mgo").onclick=go;$("#mcid").onkeydown=e=>{if(e.key==="Enter")go()};$("#mcid").focus()};

      else if(st.state==="error")fail(st.error||"Sign-in failed.");

/* jump in: recently played instances and worlds, plus the longest played instance's most played worlds */
function jumpItems(worlds){
  const inst=id=>S.instances.find(i=>i.id===id),rows=[];
  const recent=[...S.instances].filter(i=>i.last_played||Date.now()/1000-i.created<604800).sort((a,b)=>(b.last_played||b.created)-(a.last_played||a.created)).slice(0,3);
  recent.forEach(i=>rows.push({k:"i:"+i.id,t:i.last_played||i.created,inst:i}));
  const most=[...S.instances].sort((a,b)=>(b.played||0)-(a.played||0))[0],mostId=most&&most.played?most.id:null;
  const add=(w,tag)=>{const k="w:"+w.iid+"/"+w.folder;const ex=rows.find(r=>r.k===k);if(ex){if(tag)ex.tag=tag;return}if(inst(w.iid))rows.push({k,t:w.last_played,w,tag})};
  worlds.slice(0,4).forEach(w=>add(w));
  worlds.filter(w=>w.iid===mostId).sort((a,b)=>b.played-a.played).slice(0,2).forEach(w=>add(w,"Most played"));
  if(mostId&&!rows.some(r=>r.inst&&r.inst.id===mostId))rows.push({k:"i:"+mostId,t:most.last_played||0,inst:most,tag:"Most played"});
  return rows.sort((a,b)=>b.t-a.t).slice(0,8);
}

  const draw=()=>{
    host.innerHTML=`<div class="ied"><button type="button" class="pv" id="ipv" aria-label="Choose an image" title="Choose an image">${pv()}</button><div class="ib2"><button type="button" class="btn sm" id="iup">${ic("upload","sm")}Upload</button><button type="button" class="btn sm" id="irn">${ic("refresh","sm")}Randomize</button><button type="button" class="btn sm ${open?"out":""}" id="icu">${ic("palette","sm")}Customize</button>${remove&&st!=="none"?`<button type="button" class="btn sm danger" id="irm">${ic("trash","sm")}Remove</button>`:""}</div></div>
    ${open?`<div class="cust"><div class="cl">Shape</div><div class="shp">${Object.keys(SHAPES).map(k=>`<button type="button" data-sh="${k}" title="${SHAPES[k]}" class="${st==="gen"&&g.shape===k?"on":""}">${genSvg({...g,shape:k})}</button>`).join("")}</div>
     <div class="cl">Color</div><div class="cols">${HUES.map(h=>`<button type="button" data-hu="${h}" aria-label="Color" class="${st==="gen"&&g.hue===h?"on":""}" style="background:${h<0?"hsl(0 0% 60%)":`hsl(${h} 75% 55%)`}"></button>`).join("")}</div>
     <div class="cl">Background</div><div class="gap">${Object.entries(BGS).map(([k,v])=>`<button type="button" data-bg="${k}" class="chp ${st==="gen"&&g.bg===k?"on":""}">${v}</button>`).join("")}</div></div>`:""}
    <input type="file" id="ifl" accept="image/*" hidden>`;
    const pick=()=>host.querySelector("#ifl").click();
    host.querySelector("#ipv").onclick=pick;host.querySelector("#iup").onclick=pick;
    host.querySelector("#ifl").onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const b=await fileBlob(f);if(img)URL.revokeObjectURL(img.url);img={blob:b,url:URL.createObjectURL(b)};st="img";draw()}catch(err){toast(err.message,6000)}};
    host.querySelector("#irn").onclick=()=>{g.shape=rnd(Object.keys(SHAPES));g.hue=rnd(HUES.filter(h=>h>=0));g.bg=rnd(["dark","dark","tint"]);st="gen";draw()};
    host.querySelector("#icu").onclick=()=>{open=!open;if(open&&st!=="gen")st="gen";draw()};
    const rm=host.querySelector("#irm");if(rm)rm.onclick=()=>{st="none";open=false;draw()};
    host.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{g.shape=b.dataset.sh;st="gen";draw()});
    host.querySelectorAll("[data-hu]").forEach(b=>b.onclick=()=>{g.hue=+b.dataset.hu;st="gen";draw()});
    host.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{g.bg=b.dataset.bg;st="gen";draw()});
  };
  draw();
  return{
    /* what to do with the icon when the form is saved: {set: Blob} | {reset: true} | null (leave it alone) */
    async result(){if(st==="gen")return{set:await svgBlob(genSvg(g))};if(st==="img")return{set:img.blob};if(st==="none"&&initial==="keep")return{reset:true};return null}
  };
}

const PROJ_TYPE={modpack:"Modpack",mod:"Mod",resourcepack:"Resource pack",shader:"Shader",datapack:"Data pack"};
const SPIN='<div class="empty" style="padding:30px"><span class="spin"></span></div>';
function cshell(title,body,{back=null,w=540}={}){
  openOver(`<div class="modal-bg"><div class="cmodal" style="width:${w}px" role="dialog" aria-label="${esc(title)}"><div class="chead">${back?`<button class="xb" id="cb" aria-label="Back">${ic("back","sm")}</button>`:""}<h2>${esc(title)}</h2><button class="xb" id="cx" aria-label="Close">${ic("x")}</button></div><div class="cbody">${body}</div></div></div>`);
  $("#cx").onclick=closeOver;if(back)$("#cb").onclick=back;

const interleave=ls=>{const o=[];for(let i=0;ls.some(l=>i<l.length);i++)ls.forEach(l=>{if(i<l.length)o.push(l[i])});return o};
async function projSearch(q,types,limit){
  const ls=await Promise.all(types.map(t=>api(`/search?source=modrinth&type=${t}&q=${encodeURIComponent(q)}&sort=${q?"relevance":"downloads"}&limit=${limit}&page=1`).then(r=>r.hits.map(h=>({...h,ptype:t})))));
  return interleave(ls);
}
function projRows(hits){
  return hits.length?hits.map((h,i)=>`<div class="prow">${tile(h.title,h.icon_url)}<div class="grow"><div class="nm">${esc(h.title)} <span class="chip">${PROJ_TYPE[h.ptype]}</span></div><div class="meta ell">${esc(h.description)}</div></div><button class="btn out sm" data-pi="${i}">${ic("plus","sm")}Create</button></div>`).join(""):`<div class="empty" style="padding:26px 0">Nothing found. Try another search.</div>`;
}
function bindProj(root,hits){
  root.querySelectorAll("[data-pi]").forEach(b=>b.onclick=()=>startFrom(hits[b.dataset.pi],b));

async function startFrom(h,btn,label="Create"){

  try{const d=await api("/instances/from-project","POST",{source:"modrinth",ident:h.ident,type:h.ptype,task:tk.id});t.remove();endTask(tk,true,"Instance installation");closeOver();toast(d.log.slice(-1)[0]||"Created "+h.title,4000);go("inst",d.id)}
  catch(e){t.remove();endTask(tk,false,e.message);toast(e.message,8000);btn.disabled=false;btn.innerHTML=ic("plus","sm")+label}
}

function createModal(){

      if(S.rndIcon)await randomIcon(d.id);closeOver();toast(d.log.slice(-1)[0]||"Installed",4000);go("inst",d.id)}

async function customStep(){
  let snap=false,mc="",loader="fabric",dd,data,ed,lvMode="stable",lvPick="",lv=null,lvErr="",lvSeq=0,opt=false,OPT=null,OPTERR="";
  const LD=["vanilla","fabric","neoforge","forge","quilt"];
  const dflt=()=>`${LOADERS[loader]} ${mc||""}`.trim();
  cshell("Create instance",`<div id="ied"></div>
  <div class="field"><label class="l" for="cn">Name</label><input type="text" id="cn" maxlength="48" placeholder="Fabric"></div>
  <div class="field"><label class="l">Loader</label><div class="pills" id="lp"></div></div>
  <div class="field"><label class="l">Game version</label><div id="cdd"></div><label class="tog"><input type="checkbox" id="snap"> Show snapshots and pre-releases</label><div class="note" id="vnote">Loading versions...</div></div>
  <div class="field" id="lvf"><label class="l">Loader version</label><div class="pills" id="lvp"></div><div id="lvd" style="margin-top:8px"></div><div class="note" id="lvn"></div></div>
  <div class="field" id="optf"><label class="tog" id="optl"><input type="checkbox" id="opt"> Add Optimization</label><div class="note" id="optn"></div></div>
  <div class="note">It will be created in: <span style="user-select:all">${esc(S.settings.folder||"your instances folder")}</span></div>
  <div class="gap" style="justify-content:space-between;margin-top:20px"><button class="btn" id="cc">${ic("back","sm")}Back</button><button class="btn brand" id="ok">${ic("plus","sm")}Create instance</button></div>`);
  ed=iconEditor($("#ied"));
  $("#cc").onclick=createModal;
  const ph=()=>{$("#cn").placeholder=dflt();drawOpt()};
  /* "Add Optimization" only works for Fabric/NeoForge on the one game version the optimization set targets (GET /optimization). Returns why it's off, or "" when usable. */
  const optWhy=()=>{if(!OPT)return OPTERR||"Checking availability...";if(!OPT.loaders.includes(loader))return "Available for Fabric and NeoForge.";
    const c=OPT.ceilings[loader];if(!c)return `Not available for ${LOADERS[loader]} right now.`;
    return /^\d+(\.\d+)*$/.test(mc)&&vcmp(mc,c)<=0?"":`Available for ${LOADERS[loader]} releases up to Minecraft ${c}. Pick ${c} or older to turn it on.`};
  function drawOpt(){const why=optWhy(),el=$("#opt");if(!el)return;if(why)opt=false;
    el.checked=opt;el.disabled=!!why;$("#optl").style.opacity=why?".55":"";$("#optl").style.cursor=why?"default":"";
    $("#optn").textContent=why||(opt?`Orbit will look up optimization mods on Modrinth that have a build for ${LOADERS[loader]} ${mc}, and add only those, plus what they need, after creating the instance.`:"Adds performance mods matched to this game version and loader. Anything without a build for this version is skipped.")}
  const drawLoaders=()=>{$("#lp").innerHTML=LD.map(k=>`<button type="button" class="opt2 ${k===loader?"on":""}" data-l="${k}">${k===loader?ic("check","sm"):""}${LOADERS[k]}</button>`).join("");
    $("#lp").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{if(loader===b.dataset.l)return;loader=b.dataset.l;lvMode="stable";drawLoaders();ph();loadLV()})};
  const lvChoice=()=>!lv?"":lvMode==="latest"?lv.latest:lvMode==="other"?lvPick:lv.stable;
  const drawLV=()=>{
    $("#lvf").style.display=loader==="vanilla"?"none":"";if(loader==="vanilla"){$("#ok").disabled=!mc;return}
    $("#lvp").innerHTML=[["stable","Stable"],["latest","Latest"],["other","Other"]].map(([k,t])=>`<button type="button" class="opt2 ${lvMode===k?"on":""}" data-m="${k}" ${lv?"":"disabled"}>${lvMode===k?ic("check","sm"):""}${t}</button>`).join("");
    $("#lvp").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{lvMode=b.dataset.m;if(lvMode==="other"&&!lvPick)lvPick=lv.stable;drawLV()});
    $("#lvd").innerHTML="";
    if(lv&&lvMode==="other"){const el=document.createElement("div");$("#lvd").append(el);dropdown(el,()=>lv.versions,lvPick,v=>{lvPick=v;drawLV()},"Select version")}
    $("#lvn").textContent=lvErr?lvErr:!lv?"Loading loader versions...":`${LOADERS[loader]} ${lvChoice()}${lvMode==="stable"?" (recommended)":lvMode==="latest"?" (newest build)":""}`;
    $("#ok").disabled=!!lvErr||!lv;
  };
  const loadLV=async()=>{
    if(loader==="vanilla"||!mc){lv=null;lvErr="";drawLV();return}
    const seq=++lvSeq;lv=null;lvErr="";drawLV();
    try{const d=await api(`/loader-versions?loader=${loader}&mc=${encodeURIComponent(mc)}`);if(seq!==lvSeq)return;lv=d;if(!d.versions.includes(lvPick))lvPick=d.stable}
    catch(e){if(seq!==lvSeq)return;lvErr=e.message}

  };
  const ld=async()=>{try{data=await loadVersions(snap)}catch(e){$("#vnote").textContent=e.message;return}
    if(!data.versions.includes(mc))mc=data.latest&&data.versions.includes(data.latest)?data.latest:data.versions[0]||"";
    $("#vnote").textContent=data.both?`${data.versions.length} versions available on both Modrinth and CurseForge.`:`${data.versions.length} Modrinth versions. Add a CurseForge key in Settings to limit this list to versions on both platforms.`;
    dd?dd.set(mc):dd=dropdown($("#cdd"),()=>data.versions,mc,v=>{mc=v;ph();loadLV()},"Select version");ph();loadLV()};
  drawLoaders();drawLV();ph();
  $("#snap").onchange=e=>{snap=e.target.checked;ld()};
  $("#opt").onchange=e=>{opt=e.target.checked;drawOpt()};
  api("/optimization").then(o=>{OPT=o}).catch(e=>{OPTERR="Couldn't check availability: "+e.message}).finally(drawOpt);
  $("#cn").focus();await ld();
  $("#ok").onclick=async()=>{const b=$("#ok");b.disabled=true;
    const name=$("#cn").value.trim()||dflt(),wantOpt=opt&&!optWhy();let wait=null,tk=null;
    try{const body={name,mc,loader,loader_version:loader==="vanilla"?"":lvChoice()};
      if(wantOpt){tk=addTask(name,null,"Adding optimization");body.optimize=true;body.task=tk.id;wait=toast("Creating "+name+" and adding optimization mods. This can take a minute...",900000)}
      const i=await api("/instances","POST",body);
      if(wait)wait.remove();
      try{const r=await ed.result();if(r&&r.set)await uploadIcon(i.id,r.set)}catch(e){toast("Instance created, but the icon couldn't be saved: "+e.message,7000)}
      const o=i.optimization;
      if(tk)endTask(tk,!!(o&&o.ok),o&&o.ok?"Optimization added":"Optimization not added");
      closeOver();
      if(!o)toast("Created "+i.name);
      else if(!o.ok)toast(`Created ${i.name}, but optimization wasn't added: ${o.error||"unknown error"} You can add mods later from Discover.`,10000);
      else toast(`Created ${i.name} with ${o.installed.length} optimization mods`+(o.skipped.length||o.warnings.length?` (${o.skipped.length} skipped${o.warnings.length?", "+o.warnings.length+" warning"+(o.warnings.length>1?"s":""):""}).`:"."),o.skipped.length||o.warnings.length?8000:4000);
      go("inst",i.id)}catch(e){if(wait)wait.remove();if(tk)endTask(tk,false,e.message);toast(e.message,6000);b.disabled=false}};
}

  let nodes=[],desc="",desc0=d.name,desc1="1.0.0",sortDesc=false;
  const list=async p=>(await api(`/instances/${d.id}/files?path=${encodeURIComponent(p)}`)).entries;
  const mk=(e,path,st)=>({name:e.name,path,dir:e.dir,size:e.size,mtime:e.mtime,st,kids:null,open:false});
  cshell("Export modpack",SPIN,{w:720});
  try{nodes=(await list("")).filter(e=>!HIDE.test(e.name)).map(e=>mk(e,e.name,e.dir&&ON.has(e.name)?1:0))}
  catch(e){$(".cbody").innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  $(".cbody").innerHTML=`<div class="row" style="gap:14px"><div class="field grow" style="margin-top:0"><label class="l" for="xn">Modpack name</label><div class="xin"><input type="text" id="xn" maxlength="64" value="${esc(d.name)}"><button type="button" class="ib" data-clr="xn" aria-label="Clear">${ic("x","sm")}</button></div></div>
   <div class="field grow" style="margin-top:0"><label class="l" for="xv">Version number</label><div class="xin"><input type="text" id="xv" maxlength="32" value="1.0.0"><button type="button" class="ib" data-clr="xv" aria-label="Clear">${ic("x","sm")}</button></div></div></div>
   <div class="field"><label class="l" for="xd">Description</label><textarea id="xd" rows="3" maxlength="1000" placeholder="Enter modpack description..."></textarea></div>
   <div class="xt"><div class="xr h"><button type="button" class="cbx" id="xall" aria-label="Select all"></button><button type="button" class="xs" id="xsort">Name<span id="xcar"></span></button><span>Size</span><span>Modified</span><span></span></div><div id="xrows"></div></div>
   <div class="note" id="xnote"></div>
   <div class="gap" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="xc">${ic("x","sm")}Cancel</button><button class="btn brand" id="xo">${ic("box","sm")}Export</button></div>`;
  const setAll=(n,s)=>{n.st=s;if(n.kids)n.kids.forEach(k=>setAll(k,s))};
  const fix=n=>{if(!n.kids||!n.kids.length)return;n.kids.forEach(fix);const s=new Set(n.kids.map(k=>k.st));n.st=s.size===1?[...s][0]:2};
  const cmp=(a,b)=>a.dir!==b.dir?(a.dir?-1:1):a.name.localeCompare(b.name,undefined,{sensitivity:"base",numeric:true})*(sortDesc?-1:1);
  const flat=(l,depth,out)=>{[...l].sort(cmp).forEach(n=>{out.push([n,depth]);if(n.open&&n.kids)flat(n.kids,depth+1,out)});return out};
  const cb=s=>`class="cbx ${s===1?"on":s===2?"mix":""}"`,cbi=s=>s===1?ic("check","sm"):s===2?ic("minus","sm"):"";
  const when=t=>new Date(t*1000).toLocaleString(undefined,{year:"2-digit",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"});
  const gather=(n,o)=>{if(n.st===1)o.push(n.path);else if(n.st===2&&n.kids)n.kids.forEach(k=>gather(k,o));return o};
  const draw=()=>{
    const rows=flat(nodes,0,[]),all=new Set(nodes.map(n=>n.st)),hs=all.size===1?[...all][0]:2;
    $("#xall").className=`cbx ${hs===1?"on":hs===2?"mix":""}`;$("#xall").innerHTML=cbi(hs);
    $("#xcar").innerHTML=ic(sortDesc?"chev":"up","sm");
    $("#xrows").innerHTML=rows.map(([n,dp],i)=>`<div class="xr"><button type="button" ${cb(n.st)} data-c="${i}" aria-label="Include ${esc(n.name)}">${cbi(n.st)}</button><div class="xn" style="padding-left:${dp*22}px">${ic(n.dir?"folder":"file","sm")}<span class="ell">${esc(n.name)}</span></div><span class="meta">${n.dir?"":fsize(n.size)}</span><span class="meta">${esc(when(n.mtime))}</span>${n.dir?`<button type="button" class="ib" data-o="${i}" aria-label="${n.open?"Collapse":"Expand"} ${esc(n.name)}" style="${n.open?"transform:rotate(90deg)":""}">${ic("fwd","sm")}</button>`:"<span></span>"}</div>`).join("")||`<div class="empty" style="padding:24px">This instance has no files yet.</div>`;
    $("#xrows").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const n=rows[b.dataset.c][0];setAll(n,n.st===1?0:1);nodes.forEach(fix);draw()});
    $("#xrows").querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{const n=rows[b.dataset.o][0];
      if(n.open){n.open=false;return draw()}
      if(!n.kids){b.innerHTML='<span class="spin"></span>';try{n.kids=(await list(n.path)).map(e=>mk(e,n.path+"/"+e.name,n.st))}catch(e){return toast(e.message)}}
      n.open=true;draw()});
  };
  $("#xall").onclick=()=>{const on=nodes.every(n=>n.st===1);nodes.forEach(n=>setAll(n,on?0:1));draw()};
  $("#xsort").onclick=()=>{sortDesc=!sortDesc;draw()};
  $(".cbody").querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.clr);i.value="";i.focus()});
  $("#xc").onclick=closeOver;
  $("#xnote").textContent="Mods and packs that are on Modrinth are linked instead of copied, so the file stays small. Everything else you tick is packed inside.";
  draw();
  $("#xo").onclick=async()=>{
    const include=nodes.reduce((o,n)=>gather(n,o),[]),nm=$("#xn").value.trim(),vr=$("#xv").value.trim();
    if(!nm)return toast("Give the modpack a name.");if(!vr)return toast("Give the modpack a version number.");
    if(!include.length)return toast("Tick at least one file or folder to export.");
    const b=$("#xo"),label=b.innerHTML;b.disabled=true;b.innerHTML='<span class="spin"></span> Exporting...';
    const undo=()=>{b.disabled=false;b.innerHTML=label};
    try{
      const f=await api("/pick-save","POST",{name:`${nm} ${vr}.mrpack`.replace(/[\\/:*?"<>|]+/g,"")});
      if(!f.unavailable&&!f.path){undo();return}
      const r=await api(`/instances/${d.id}/export`,"POST",{name:nm,version:vr,description:$("#xd").value,include,dest:f.path||""});
      exportDone(r,!!f.unavailable);
    }catch(e){toast(e.message,9000);undo()}
  };
}
function exportDone(r,auto){
  openOver(`<div class="modal-bg"><div class="modal"><h2>Modpack exported</h2>
  <p style="margin:0 0 6px">${auto?"A save dialog isn't available here, so the file went to your Downloads folder:":"Saved to:"}<br><span class="meta" style="user-select:all;word-break:break-all">${esc(r.path)}</span></p>
  <div class="note">${r.hosted} file${r.hosted===1?"":"s"} link${r.hosted===1?"s":""} to Modrinth. ${r.embedded} ${r.embedded===1?"is":"are"} packed inside. Size: ${esc(fsize(r.size))}.</div>

  <div class="gap" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="xs1">${ic("folder","sm")}Show in folder</button><button class="btn brand" id="xd1">Done</button></div></div></div>`);

const rndIconOpt=()=>`<label class="rnd"><input type="checkbox" id="rndic" ${S.rndIcon?"checked":""}> Give each imported instance a random icon</label>`;
const srcText=s=>{const n={mods:"mods",resourcepacks:"resource packs",shaderpacks:"shaders",datapacks:"data packs"};return Object.entries(s.counts).map(([k,v])=>`${v} ${n[k]}`).join(", ")};
async function importStep(L){
  const NAMES={tlauncher:"TLauncher",modrinth:"Modrinth App",curseforge:"CurseForge"};
  cshell("Import from "+NAMES[L],SPIN,{back:importMenu,w:640});
  let r;try{r=await api("/import/scan?launcher="+L)}catch(e){
    $(".cbody").innerHTML=`<div class="empty" style="padding:30px">${esc(e.message)}</div><div class="gap" style="justify-content:flex-end"><button class="btn" id="ics">${ic("set","sm")}Open settings</button></div>`;$("#ics").onclick=()=>settingsModal("import");return}
  const vs=r.versions;vs.forEach(v=>{v.pick=(v.sources||[])[0]?v.sources[0].path:""});const can=v=>!v.imported&&!v.unsupported;
  const opts=v=>`<option value="">Don't copy any files</option>`+v.sources.map(s=>`<option value="${esc(s.path)}" ${s.path===v.pick?"selected":""}>${esc(s.label)}: ${esc(srcText(s))}</option>`).join("")+`<option value="__browse">Choose another folder...</option>`;
  const draw=()=>{$(".cbody").innerHTML=vs.length?`<div class="note" style="margin:0 0 12px">Found in <span style="user-select:all">${esc(r.folder)}</span>. Each one becomes a Orbit instance with the same Minecraft version, loader and settings.</div>
   ${vs.map((v,i)=>`<div class="card" style="margin-bottom:10px"><label class="row c" style="cursor:${can(v)?"pointer":"default"}"><input type="checkbox" data-v="${i}" ${can(v)?"checked":"disabled"}><div class="grow"><div class="nm">${esc(v.name)}</div><div class="meta">${LOADERS[v.loader]||esc(v.loader||"Unknown")} ${esc(v.mc)}${v.loader_version?" &middot; "+esc(v.loader_version):""}${v.total?" &middot; "+esc(srcText(v)):""}</div>
    ${can(v)&&(v.groups.length||v.settings.memory||v.settings.jvm_args||v.icon)?`<div class="gap" style="margin-top:6px;gap:6px">${v.groups.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}${v.settings.memory?`<span class="chip">${v.settings.memory} MB memory</span>`:""}${v.settings.jvm_args?'<span class="chip">Java arguments</span>':""}</div>`:""}</div>
    ${v.imported?'<span class="chip">Already imported</span>':v.guessed?'<span class="chip" title="Version and loader were worked out from the mod files, not read from the app. Check them after importing.">Version guessed</span>':v.unsupported?`<span class="chip cf">${esc(v.unsupported)}</span>`:""}</label>
    ${L==="tlauncher"&&can(v)?`<div class="field" style="margin:10px 0 0"><label class="meta" for="sr${i}">Copy files from</label><select class="sel" style="width:100%" id="sr${i}" data-s="${i}">${opts(v)}</select>${v.sources.length?"":`<div class="note">No mods, resource packs or shaders were found automatically. Choose the folder that holds your <code>mods</code> folder.</div>`}</div>`:""}</div>`).join("")}
   <label class="tog" style="margin:12px 0 0"><input type="checkbox" id="sv"> Also copy worlds (saves). This can take a while for big worlds.</label>
   ${rndIconOpt()}
   <div class="note">Settings, options.txt, servers and config files come along too. Nothing is changed in ${NAMES[L]}.</div>
   <div class="gap" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="ic2">Cancel</button><button class="btn brand" id="ii" ${vs.some(can)?"":"disabled"}>Import</button></div>`
   :`<div class="empty" style="padding:30px">Nothing to import was found in<br><span class="meta" style="user-select:all">${esc(r.folder)}</span><br><br>Check the folder in Settings &gt; Import folders.</div><div class="gap" style="justify-content:flex-end"><button class="btn" id="ic2">Close</button></div>`;
  $("#ic2").onclick=closeOver;
  document.querySelectorAll("[data-s]").forEach(sel=>sel.onchange=async()=>{const v=vs[sel.dataset.s];
    if(sel.value!=="__browse"){v.pick=sel.value;return}
    try{const b=await api("/browse","POST",{start:r.folder});if(!b.path){sel.value=v.pick;return}
      const c=await api("/import/inspect?path="+encodeURIComponent(b.path));
      if(!c.total)toast("No mods, resource packs or shaders found directly in that folder. Pick the folder that contains a mods folder.",7000);
      v.sources=v.sources.filter(s=>s.path!==c.path);v.sources.unshift({label:"Chosen folder",path:c.path,counts:c.counts,total:c.total});v.pick=c.path;draw()}
    catch(e){toast(e.message,6000);sel.value=v.pick}});
  if($("#ii"))$("#ii").onclick=async()=>{const items=[...document.querySelectorAll("[data-v]:checked")].map(x=>({id:vs[x.dataset.v].id,source:vs[x.dataset.v].pick}));if(!items.length)return toast("Pick at least one instance");
    const b=$("#ii"),saves=$("#sv").checked;S.rndIcon=$("#rndic").checked;b.disabled=true;b.innerHTML='<span class="spin"></span> Importing...';
    try{const d=await api("/import/run","POST",{launcher:L,items,saves});if(S.rndIcon)for(const x of d.imported)await randomIcon(x.id);closeOver();
      const f=d.imported.reduce((a,x)=>a+x.files,0),lk=d.imported.reduce((a,x)=>a+x.linked,0),ch=d.imported.reduce((a,x)=>a+x.checked,0),ne=d.imported.some(x=>x.net_error);
      toast(`Imported ${d.imported.length} instance${d.imported.length===1?"":"s"} and ${f} file${f===1?"":"s"}. ${ch?`${lk} of ${ch} mods and packs matched on Modrinth. `:""}${ne?"Couldn't reach Modrinth, so open an instance's Content tab and press Match with Modrinth later.":""}`,ne?12000:7000);go("home")}
    catch(e){toast(e.message,8000);b.disabled=false;b.textContent="Import"}};};
  draw();
}

async function job(act,body,msg){
  if(act==="remove"&&body.keys&&body.keys.length>1&&!confirm(`Remove ${body.keys.length} items?`))return;
  const t=toast(msg,60000),ins=S.instances.find(i=>i.id===S.inst)||{name:"Instance"};
  const N={update:"Updating items",remove:"Removing items","set-version":"Switching version",relink:"Matching with Modrinth"}[act];
  const tk=N?addTask(ins.name,ins.icon?iconUrl(ins):"",body.keys&&act==="update"?`Updating ${body.keys.length} item${body.keys.length===1?"":"s"}`:N):null;
  try{const d=await api(`/instances/${S.inst}/${act}`,"POST",{...body,task:tk&&tk.id});S.detail=d;t.remove();tk&&endTask(tk,true);toast(d.log.slice(-3).join("  |  ")||"Done",5000);render()}
  catch(e){t.remove();tk&&endTask(tk,false,e.message);toast(e.message,6000)}
}


/* ---------- download manager ---------- */
const saveTasks=()=>{S.tasks=S.tasks.slice(-60);api("/tasks","POST",{tasks:S.tasks}).catch(()=>{})};
function addTask(title,icon_url,sub){const t={id:Date.now()+""+Math.random().toString(36).slice(2,6),title,icon_url:icon_url||"",sub,status:"running",ts:Date.now()};S.tasks.push(t);saveTasks();topbar();pollTasks();return t}
let taskPoll=null;
function pollTasks(){
  if(taskPoll)return;
  taskPoll=setInterval(async()=>{
    const run=S.tasks.filter(t=>t.status==="running");
    if(!run.length){clearInterval(taskPoll);taskPoll=null;return}
    await Promise.all(run.map(async t=>{try{const r=await api("/progress?id="+encodeURIComponent(t.id));if(t.status==="running"){t.pct=r.pct;t.label=r.label||""}}catch(e){}}));
    if(S.tpOpen)drawTasks();
  },500);
}
function endTask(t,ok,sub){delete t.pct;delete t.label;t.status=ok?"done":"error";if(sub)t.sub=sub;t.ts=Date.now();saveTasks();topbar()}
function toggleTasks(){S.tpOpen=!S.tpOpen;if(!S.tpOpen){const e=$("#tpan");e&&e.remove()}else drawTasks()}
function drawTasks(){
  let el=$("#tpan");if(!el){el=document.createElement("div");el.id="tpan";el.className="tpan";document.body.append(el)}
  const row=t=>`<div class="tit">${tile(t.title,t.icon_url)}<div class="tx"><b>${esc(t.title)}</b><div class="meta ${t.status==="error"?"err":""}">${t.status==="running"?(t.pct!=null?`${Math.round(t.pct*100)}% · `:"")+esc(t.sub)+(t.label?" · "+esc(t.label):""):esc(ago(new Date(+t.ts).toISOString()))+" · "+esc(t.sub)}</div>${t.status==="running"?`<div class="pbar ${t.pct==null?"ind":""}"><i style="width:${t.pct==null?35:Math.round(t.pct*100)}%"></i></div>`:""}</div>${t.status==="running"?"":`<button class="ib" data-td="${esc(t.id)}" aria-label="Remove">${ic("trash","sm")}</button>`}</div>`;
  const run=S.tasks.filter(t=>t.status==="running").reverse(),done=S.tasks.filter(t=>t.status!=="running").reverse();
  el.innerHTML=`<h3>Tasks</h3><div class="tb">${run.length?`<div class="tsec">${ic("chev","sm")}<span class="grow">In progress</span></div>${run.map(row).join("")}`:""}${done.length?`<div class="tsec">${ic("chev","sm")}<span class="grow">Complete</span><button class="lnk" id="tcl">Clear all</button></div>${done.map(row).join("")}`:""}${S.tasks.length?"":'<div class="empty" style="padding:30px">No downloads yet.</div>'}</div>`;
  el.onmousedown=e=>e.stopPropagation();
  el.querySelectorAll("[data-td]").forEach(b=>b.onclick=()=>{S.tasks=S.tasks.filter(t=>t.id!==b.dataset.td);saveTasks();drawTasks()});
  const c=$("#tcl");if(c)c.onclick=()=>{S.tasks=S.tasks.filter(t=>t.status==="running");saveTasks();drawTasks()};
}
document.addEventListener("mousedown",e=>{if(S.tpOpen&&!e.target.closest("#dlm")){S.tpOpen=false;const t=$("#tpan");t&&t.remove()}});

/* console */
function svConsole(box,d){
  box.innerHTML=`<div class="term" id="term" role="log" aria-live="off" tabindex="0"></div><div class="tin"><span>&gt;</span><input type="text" id="tcmd" placeholder="Type a command, e.g. say hello  or  op Steve" autocomplete="off" spellcheck="false"><button class="btn brand sm" id="tsend">Send</button></div><div class="gap" style="margin-top:6px;align-items:center"><div class="note grow" id="tmode" style="margin:0"></div><button class="lnk" id="tdiag" title="Work out what most likely went wrong">${ic("search","sm")}Diagnose</button><button class="lnk" id="tcopy" title="Copy the selected text, or the whole console if nothing is selected">${ic("file","sm")}Copy</button><button class="lnk" id="tclear" title="Clear the view (the log file isn't touched)">${ic("trash","sm")}Clear</button></div>`;
  const term=$("#term"),n=d.name,hist=[];$("#tdiag").onclick=()=>diagModal(true,d.name);let seq=0,hi=0;
  const cls=l=>/\b(ERROR|FATAL|Exception)\b|\[Orbit\]/.test(l)?(/\[Orbit\]/.test(l)?"c":"e"):/\bWARN/.test(l)?"w":l.startsWith(">")?"c":/\bDEBUG\b/.test(l)?"o":"";
  const add=ls=>{const near=term.scrollHeight-term.scrollTop-term.clientHeight<60,f=document.createDocumentFragment();
    ls.forEach(l=>{const e=document.createElement("div");e.className=cls(l);e.textContent=l.replace(/\x1b\[[0-9;]*m/g,"");f.append(e)});term.append(f);
    while(term.childElementCount>1500)term.firstChild.remove();if(near)term.scrollTop=term.scrollHeight};
  const note={live:"Live console from Orbit.",ended:"The server has stopped.",log:"Showing logs/latest.log. This server wasn't started from Orbit, so commands aren't available.",none:"No output yet. Start the server to see its console."};

    try{const r=await sapi(n,"/console?since="+seq);if(r.reset)term.textContent="";add(r.lines);seq=r.seq;$("#tmode").textContent=note[r.mode]||""}catch(e){}
    setTimeout(poll,1000)};
  poll();
  const send=async()=>{const i=$("#tcmd"),c=i.value.trim();if(!c)return;i.value="";hist.push(c);hi=hist.length;try{await sapi(n,"/command","POST",{command:c})}catch(e){toast(e.message,4000)}};
  const copyText=async t=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove()}toast("Copied",1500)};
  $("#tcopy").onclick=()=>{const sel=String(getSelection());copyText(sel&&term.contains(getSelection().anchorNode)?sel:[...term.children].map(e=>e.textContent).join("\n"))};
  $("#tclear").onclick=()=>{term.textContent=""};
  $("#tsend").onclick=send;$("#tcmd").onkeydown=e=>{if(e.key==="Enter")send();else if(e.key==="ArrowUp"&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);e.target.value=hist[hi]}else if(e.key==="ArrowDown"&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);e.target.value=hist[hi]||""}};
}

async function svBrowse(d,type){

      $("#sbn").textContent=`Showing ${label}s for ${r.mc?"Minecraft "+r.mc:"any version"}${r.loaders.length?" on "+r.loaders.map(pretty).join(" / "):""}.`;draw()}
    catch(e){$("#sbr").innerHTML=`<div class="empty" style="padding:30px">${esc(e.message)}</div>`}};

    try{const r=await sapi(d.name,pack?"/content/modpack":"/content/install","POST",pack?{ident:h.ident,task:tk.id}:{project:h.key,task:tk.id});w.remove();endTask(tk,true);toast((r.log||[]).slice(-3).join("  |  ")||"Installed",5000);h.installed=true;draw();
      if(S.page==="srv"&&S.stab==="content")svContent($("#tabbody"),S.sd)}
    catch(e){w.remove();endTask(tk,false,e.message);toast(e.message,8000);btn.disabled=false;btn.textContent="Install"}};
  $("#sbq").oninput=()=>{clearTimeout(t);t=setTimeout(()=>{page=1;run()},350)};$("#sbs").onchange=()=>{page=1;run()};$("#sbq").focus();run();

}

/* ---------- project page (in-app) ---------- */
function md(src){
  let t=String(src||"").replace(/\r/g,"");
  t=t.replace(/<a[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi,"[$2]($1)").replace(/<img[^>]*?src=["']([^"']+)["'][^>]*>/gi,"\n![]($1)\n").replace(/<br\s*\/?>/gi,"\n").replace(/<\/?(p|div|center|span|details|summary|b|i|strong|em|u|ul|li|ol|table|tr|td|th|thead|tbody|kbd|sub|sup|font|h[1-6])[^>]*>/gi,"\n").replace(/<!--[\s\S]*?-->/g,"");
  const safe=u=>/^https?:\/\//i.test(u)?u:"#";
  const inl=x=>esc(x).replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(m,a,u)=>`<img src="${safe(u.replace(/&amp;/g,"&"))}" alt="${a}" referrerpolicy="no-referrer" loading="lazy">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,(m,a,u)=>`<a data-ext="${safe(u.replace(/&amp;/g,"&"))}">${a}</a>`)
    .replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/__([^_]+)__/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a data-ext="$2">$2</a>');
  const out=[],L=t.split("\n");let i=0;
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`);continue}
    let m;if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*[-*+]\s+/.test(l)||/^\s*\d+[.)]\s+/.test(l)){const ol=/^\s*\d/.test(l),b=[];while(i<L.length&&(/^\s*[-*+]\s+/.test(L[i])||/^\s*\d+[.)]\s+/.test(L[i])))b.push(`<li>${inl(L[i++].replace(/^\s*([-*+]|\d+[.)])\s+/,""))}</li>`);out.push(`<${ol?"ol":"ul"}>${b.join("")}</${ol?"ol":"ul"}>`);continue}
    if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,""));out.push(`<blockquote>${inl(b.join(" "))}</blockquote>`);continue}
    if(!l.trim()){i++;continue}
    const b=[];while(i<L.length&&L[i].trim()&&!/^(```|#{1,4}\s|\s*[-*+]\s|\s*\d+[.)]\s|>)/.test(L[i]))b.push(L[i++]);
    out.push(b.length?`<p>${inl(b.join("\n")).replace(/\n/g,"<br>")}</p>`:inl(L[i++]))}
  return out.join("");
}
function openProject(h){
  if(h.source==="curseforge"||/^cf:/.test(h.ident||"")){openUrl(h.url);return}
  S.pj={ident:h.ident,type:h.ptype||S.br.type||"mod",inst:S.bt||(S.page==="inst"?S.inst:null),tab:"desc",data:null,versions:null,vf:{ch:"",mc:"",ld:""},ctx:null};
  go("proj",h.ident);
}
async function rProj(m){
  m.className="split";const pj=S.pj;if(!pj){go("browse");return}
  m.innerHTML=`<div class="dcol pg"><div class="empty"><span class="spin"></span></div></div>`;
  try{
    if(!pj.data||pj.data.slug!==pj.ident&&pj.data.id!==pj.ident){pj.data=await api("/project?id="+encodeURIComponent(pj.ident));pj.versions=null}
    pj.ctx=pj.inst?await api("/instances/"+pj.inst):null;
    if(pj.ctx&&!pj.vfSet){pj.vf.mc=pj.ctx.mc;pj.vf.ld=pj.ctx.loader!=="vanilla"&&pj.data.type==="mod"?pj.ctx.loader:"";pj.vfSet=true}
    topbar();
  }catch(e){m.innerHTML=`<div class="dcol pg"><div class="empty">${esc(e.message)}</div></div>`;return}
  drawProj(m);

   `<div class="fg"><div class="fh" style="cursor:default">Source</div>${srvMode()?`<div class="note" style="margin:0">${TYPES[b.type]} for servers come from Modrinth.</div>`:`<div class="seg" id="src"><button data-s="modrinth" class="${mr?"on":""}">Modrinth</button><button data-s="curseforge" class="${mr?"":"on"}">CurseForge</button></div>`}${mr?"":'<div class="note">CurseForge needs an API key (Settings). Category filters are Modrinth-only.</div>'}</div>`;
  if(mr)(S.filters[ft]||[]).forEach(g=>{h+=grp("c"+g.header,pretty(g.header==="categories"?"category":g.header==="features"?"feature":g.header),g.items.map(n=>fi("c",n,pretty(n),b.cats.includes(n))).join(""))});
  if((b.type==="mod"||b.type==="modpack")&&!srvMode())h+=grp("loader","Loader",Object.entries(MODLOADERS).map(([k,v])=>fi("l",k,v,b.loader===k)).join(""));
  h+=grp("gv","Game version",`<div id="gvd"></div>`);
  fc.innerHTML=h;
  fc.querySelectorAll("button.fh").forEach(x=>x.onclick=()=>{const g=x.parentElement.dataset.g;S.shut[g]=!S.shut[g];x.parentElement.classList.toggle("shut")});
  fc.querySelectorAll("button.fi").forEach(x=>x.onclick=()=>{const{k,v}=x.dataset;
    if(k==="c"){const i=b.cats.indexOf(v);i<0?b.cats.push(v):b.cats.splice(i,1)}else b.loader=b.loader===v?"":v;
    b.page=1;drawFilters();runSearch()});
  if($("#hide"))$("#hide").onclick=()=>{b.hide=!b.hide;b.page=1;drawFilters();runSearch()};
  if($("#src"))$("#src").querySelectorAll("button").forEach(x=>x.onclick=()=>{if(b.source===x.dataset.s)return;b.source=x.dataset.s;b.page=1;render()});
  loadVersions(false).then(d=>{const el=$("#gvd");if(el)dropdown(el,()=>["Any",...d.versions],b.mc||"Any",v=>{b.mc=v==="Any"?"":v;b.page=1;runSearch()},"Any")}).catch(()=>{});
}

/* ---------- settings (modal, like the Modrinth app) ---------- */
function settingsModal(sec="appearance"){
  const nav=[["DISPLAY",[["appearance","Appearance","brush"]]],["INSTANCES",[["storage","Storage","folder"],["launch","Launch","play"]]],["INTEGRATIONS",[["accounts","Microsoft account","key"],["curseforge","CurseForge key","key"],["tlauncher","TLauncher","box"],["import","Import folders","folder"]]],["ABOUT",[["about","About Orbit","info"]]]];
  openOver(`<div class="modal-bg"><div class="smodal" role="dialog" aria-label="Settings"><div class="shead"><h2>Settings</h2><button class="xb" id="sx" aria-label="Close">${ic("x")}</button></div>
  <div class="sbody"><div class="snav">${nav.map(([h,items])=>`<h4>${h}</h4>`+items.map(([k,t,i])=>`<button data-sec="${k}" class="${k===sec?"on":""}">${ic(i,"sm")}${t}</button>`).join("")).join("")}</div><div class="spane" id="sp"></div></div></div></div>`);
  $("#sx").onclick=closeOver;
  ov().querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>settingsModal(b.dataset.sec));
  api("/settings").then(s=>{S.settings=s;({appearance:pAppearance,storage:pStorage,launch:pLaunch,accounts:pAccounts,curseforge:pCF,tlauncher:pTL,import:pImport,about:pAbout})[sec]($("#sp"))});
}
const AC=[["Orbit green",""],["Blue","#4c8dff"],["Purple","#a56bff"],["Pink","#ff5fa2"],["Orange","#ff9a3c"],["Red","#ff496e"],["Teal","#2ad4c9"]];
function pAppearance(p){
  const th=[["dark","Dark","#16181c","#26292f","#4a4f58"],["light","Light ☀","#f5f5f5","#ffffff","#2c2e31"],["oled","OLED ☾","#000","#16181c","#3a3f47"],["system","Sync with system","#000","#16181c","#3a3f47"]];
  const cur=S.settings.theme||"oled";
  p.innerHTML=`<h3>Color theme</h3><div class="d">Select your preferred color theme across Orbit.</div><div class="themes">${th.map(([k,l,bg,fg,ln])=>`<button class="th ${cur===k?"on":""}" data-th="${k}"><div class="pv" style="background:${bg}"><div style="background:${fg}"><u style="background:${ln}"></u><s><i style="background:${k==="light"?"#2c2e31":"#d6dbe0"}"></i><i style="background:${ln};width:60%"></i></s></div></div><div class="lb"><span class="rd"></span>${l}</div></button>`).join("")}</div>
  <h3>High contrast</h3><div class="d">Stronger text and borders and a clear focus outline, for easier reading.</div>
  <div class="tgl" id="hc" role="switch" tabindex="0" aria-checked="${!!S.settings.high_contrast}">High contrast mode<span class="sw ${S.settings.high_contrast?"on":""}"></span></div>
  <h3 style="margin-top:22px">Accent color</h3><div class="d">Used for buttons, highlights and links. Text colors are adjusted to stay readable.</div>
  <div class="swts" id="acs">${AC.map(([n,h])=>`<button class="swt ${(S.settings.accent||"")===h?"on":""}" data-ac="${h}" title="${n}" aria-label="${n}" style="background:${h||"#1bd96a"}"></button>`).join("")}<label class="swt cust ${S.settings.accent&&!AC.some(a=>a[1]===S.settings.accent)?"on":""}" title="Custom color"><input type="color" id="acc" aria-label="Custom accent color" value="${S.settings.accent||"#1bd96a"}"></label></div>
  <div class="note" style="margin-top:6px">${S.settings.accent?`Accent: ${esc(S.settings.accent)}`:"Accent: Orbit green (default)"}</div>`;
  p.querySelectorAll("[data-th]").forEach(b=>b.onclick=async()=>{const t=b.dataset.th;applyTheme(t);S.settings=await api("/settings","POST",{theme:t});pAppearance(p)});
  const hcT=async()=>{const v=!S.settings.high_contrast;S.settings.high_contrast=v;applyLook();try{S.settings=await api("/settings","POST",{high_contrast:v})}catch(e){toast(e.message,4000)}pAppearance(p)};
  $("#hc").onclick=hcT;$("#hc").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();hcT()}};
  const setAcc=async hex=>{S.settings.accent=hex;applyAccent(hex);try{S.settings=await api("/settings","POST",{accent:hex})}catch(e){toast(e.message,4000)}pAppearance(p)};
  p.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>setAcc(b.dataset.ac));
  $("#acc").oninput=e=>applyAccent(e.target.value);$("#acc").onchange=e=>setAcc(e.target.value);
}
function pAccounts(p){
  const st=S.settings,M=st.ms_accounts||[];
  p.innerHTML=`<h3>Microsoft account</h3><div class="d">Sign in with your official Minecraft account to play on online-mode servers with your own skin and cape. Orbit keeps the sign-in on this computer only.</div>
  ${M.length?M.map(x=>`<div class="accrow" style="cursor:default;margin-bottom:6px">${msFace(x,34)}<span class="grow"><b>${esc(x.name)}</b><span class="meta" style="display:block">${x.id===st.ms_active?"Active account":"Signed in"}</span></span>${x.id===st.ms_active?"":`<button class="btn" data-use="${esc(x.id)}">Use this</button>`}<button class="btn" data-out="${esc(x.id)}">Sign out</button></div>`).join(""):'<div class="note">No Microsoft account is signed in.</div>'}
  <div class="gap" style="margin-top:12px"><button class="btn brand" id="msin">${ic("plus","sm")}Sign in with Microsoft</button>${st.ms_active?'<button class="btn" id="msoff">Play offline instead</button>':""}</div>
  <h3 style="margin-top:24px">Application ID</h3><div class="d">Microsoft only lets launchers with an approved app registration sign players in. Paste yours here (see the sign-in dialog for how to get one).</div>
  <input type="text" id="mcid2" value="${esc(st.ms_client_id||"")}" placeholder="00000000-0000-0000-0000-000000000000" spellcheck="false"><div class="gap" style="margin-top:10px"><button class="btn" id="mcs">Save ID</button></div>`;
  const redo=async()=>{try{S.settings=await api("/settings")}catch(e){}pAccounts(p)};
  $("#msin").onclick=()=>msSignIn(redo);
  p.querySelectorAll("[data-use]").forEach(b=>b.onclick=async()=>{try{S.settings=await api("/settings","POST",{ms_active:b.dataset.use});pAccounts(p)}catch(e){toast(e.message,5000)}});
  p.querySelectorAll("[data-out]").forEach(b=>b.onclick=async()=>{if(!confirm("Sign this account out of Orbit?"))return;try{S.settings=await api("/settings","POST",{ms_remove:b.dataset.out});pAccounts(p)}catch(e){toast(e.message,5000)}});
  if($("#msoff"))$("#msoff").onclick=async()=>{try{S.settings=await api("/settings","POST",{ms_active:""});pAccounts(p)}catch(e){toast(e.message,5000)}};
  $("#mcs").onclick=async()=>{try{S.settings=await api("/settings","POST",{ms_client_id:$("#mcid2").value});toast("Saved",2000)}catch(e){toast(e.message,6000)}};
}
function pStorage(p){
  const s=S.settings;let val=s.folder;
  p.innerHTML=`<h3>Instances location</h3><div class="d">Where Orbit keeps your instances (each one is a folder holding its mods, resource packs, data packs and shaders). Point this at another drive if your main one is short on space.</div>
  <div class="path"><input type="text" id="pd" value="${esc(s.folder)}" spellcheck="false" aria-label="Instances folder"><button class="btn" id="br">${ic("folder","sm")}Browse</button></div>
  <label class="tog" id="mvw" style="${s.count?"":"display:none"}"><input type="checkbox" id="mv" checked> Move my ${s.count} existing instance${s.count===1?"":"s"} to the new location</label>
  <div class="note">${s.is_default?"This is the default location.":`Default location: <span style="user-select:all">${esc(s.default_folder)}</span>.`}<br>Instances you don't move stay where they are but won't show up in Orbit until you point back at that folder.</div>
  <div class="gap" style="margin-top:16px"><button class="btn brand" id="sv" disabled>Save location</button>${s.is_default?"":'<button class="btn" id="rs">Reset to default</button>'}</div>`;
  const chk=()=>{$("#sv").disabled=$("#pd").value.trim()===s.folder||!$("#pd").value.trim()};
  $("#pd").oninput=chk;
  $("#br").onclick=async()=>{try{const r=await api("/browse","POST",{start:$("#pd").value});if(r.path){$("#pd").value=r.path;chk()}}catch(e){toast(e.message,5000)}};
  const save=async(dir)=>{const b=$("#sv");b.disabled=true;
    try{const r=await api("/settings","POST",{instances_dir:dir,move:$("#mv")?$("#mv").checked:false});S.settings=r;
      toast(r.moved?`Moved ${r.moved} instance${r.moved===1?"":"s"} to ${r.folder}`:`Instances folder is now ${r.folder}`,5000);
      S.instances=(await api("/instances")).instances;nav();topbar();if(S.page==="inst"&&!S.instances.find(i=>i.id===S.inst))go("lib");else if(S.page!=="inst")render();pStorage(p)}
    catch(e){toast(e.message,7000);b.disabled=false}};
  $("#sv").onclick=()=>save($("#pd").value.trim());
  if($("#rs"))$("#rs").onclick=()=>save("");
}
function pLaunch(p){
  const s=S.settings;
  p.innerHTML=`<h3>Launching the game</h3><div class="d">Orbit downloads what each version needs, then starts Minecraft as an offline player.</div>
  <div class="field"><label class="l">Active player name</label><input type="text" id="lu" maxlength="16" value="${esc(s.username)}" placeholder="3 to 16 letters, numbers or underscores"><div class="note">Works for singleplayer and servers in offline mode. Servers that check accounts will refuse it. Add and switch between several names with the Playing as card on Home.</div></div>
  <div class="field"><label class="l">Default memory (MB)</label><input type="text" id="lm" value="${esc(s.memory||4096)}"></div>
  <div class="field"><label class="l">Java (optional)</label><input type="text" id="lj" value="${esc(s.java_path)}" placeholder="Leave blank: Orbit downloads the Java this version needs"><div class="note">Path to java.exe / javaw.exe (Windows) or java (Linux) if you'd rather use your own.</div></div>
  <div class="field"><label class="l">Extra Java arguments (all instances)</label><input type="text" id="la" value="${esc(s.jvm_args)}"></div>
  <button class="btn brand" id="lv">Save</button>`;
  $("#lv").onclick=async()=>{try{S.settings=await api("/settings","POST",{username:$("#lu").value,memory:$("#lm").value,java_path:$("#lj").value,jvm_args:$("#la").value});toast("Saved");pLaunch(p)}catch(e){toast(e.message,6000)}};
}
function pCF(p){
  const h=S.settings.has_cf_key;
  p.innerHTML=`<h3>CurseForge API key</h3><div class="d">A free personal key from console.curseforge.com. It unlocks CurseForge search and limits the version list to versions on both platforms. ${h?"<b style='color:var(--accent)'>A key is saved.</b>":""}</div>
  <input type="password" id="key" placeholder="${h?"Enter a new key to replace it":"Paste your key"}"><div class="gap" style="margin-top:12px"><button class="btn brand" id="sv">Save key</button>${h?'<button class="btn" id="cl">Remove key</button>':""}</div>`;
  const save=async v=>{S.settings=await api("/settings","POST",{cf_key:v});S.vers={};toast("Saved");pCF(p)};
  $("#sv").onclick=()=>$("#key").value.trim()?save($("#key").value):toast("Paste a key first");
  if($("#cl"))$("#cl").onclick=()=>save("");
}
function pTL(p){
  const s=S.settings;
  p.innerHTML=`<h3>TLauncher folder</h3><div class="d">Orbit imports TLauncher versions from here, and "Use in TLauncher" on an instance writes a version into this folder's <code>versions</code> folder. This is TLauncher's game folder, normally <code>.minecraft</code>.</div>
  <div class="path"><input type="text" id="td" value="${esc(s.tl_dir)}" spellcheck="false" aria-label="TLauncher folder"><button class="btn" id="tb">${ic("folder","sm")}Browse</button></div>
  <div class="note">${s.tl_is_default?"This is the default (.minecraft).":`Default: <span style="user-select:all">${esc(s.tl_default)}</span>`}<br>Fabric and Quilt work on their own. Forge and NeoForge need Java installed, because Orbit runs their official installer into this folder.</div>
  <div class="gap" style="margin-top:16px"><button class="btn brand" id="ts" disabled>Save folder</button>${s.tl_is_default?"":'<button class="btn" id="tr">Reset to default</button>'}</div>`;
  const chk=()=>{$("#ts").disabled=$("#td").value.trim()===s.tl_dir||!$("#td").value.trim()};
  $("#td").oninput=chk;
  $("#tb").onclick=async()=>{try{const r=await api("/browse","POST",{start:$("#td").value});if(r.path){$("#td").value=r.path;chk()}}catch(e){toast(e.message,5000)}};
  const save=async v=>{try{S.settings=await api("/settings","POST",{tlauncher_dir:v});toast("Saved");pTL(p)}catch(e){toast(e.message,6000)}};
  $("#ts").onclick=()=>save($("#td").value.trim());if($("#tr"))$("#tr").onclick=()=>save("");
}
function pImport(p){
  const s=S.settings;
  const blk=(id,title,d,val,def,isDef)=>`<h3>${title}</h3><div class="d">${d}</div><div class="path"><input type="text" id="${id}" value="${esc(val)}" spellcheck="false" aria-label="${title} folder"><button class="btn" data-b="${id}">${ic("folder","sm")}Browse</button></div>
   <div class="note">${isDef?"This is the default location.":`Default: <span style="user-select:all">${esc(def)}</span>`}</div><div class="gap" style="margin:12px 0 28px"><button class="btn brand" data-sv="${id}" disabled>Save folder</button>${isDef?"":`<button class="btn" data-rs="${id}">Reset to default</button>`}</div>`;
  p.innerHTML=blk("md","Modrinth App","Where the Modrinth App keeps its profiles (the <code>profiles</code> folder). Used by Create instance > Import instance.",s.mr_dir,s.mr_default,s.mr_is_default)+
   blk("cd","CurseForge app","The CurseForge app's Minecraft folder (the one that holds <code>Instances</code>).",s.cfa_dir,s.cfa_default,s.cfa_is_default);
  const keys={md:["modrinth_dir",s.mr_dir],cd:["curseforge_dir",s.cfa_dir]};
  const save=async(id,v)=>{try{S.settings=await api("/settings","POST",{[keys[id][0]]:v});toast("Saved");pImport(p)}catch(e){toast(e.message,6000)}};
  p.querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{const id=b.dataset.b;try{const r=await api("/browse","POST",{start:$("#"+id).value});if(r.path){$("#"+id).value=r.path;p.querySelector(`[data-sv=${id}]`).disabled=false}}catch(e){toast(e.message,5000)}});
  p.querySelectorAll("input[type=text]").forEach(i=>i.oninput=()=>{p.querySelector(`[data-sv=${i.id}]`).disabled=!i.value.trim()||i.value.trim()===keys[i.id][1]});
  p.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>save(b.dataset.sv,$("#"+b.dataset.sv).value.trim()));
  p.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>save(b.dataset.rs,""));
}
async function startUpdate(){
  if(S.updBusy||!S.orbUpd)return;
  let busy=false;try{busy=Object.keys((await api("/launch-status")).running||{}).length>0}catch(e){}
  const notes=(S.orbUpd.notes||"").split("\n").slice(0,10).join("\n");
  if(!confirm("Update Orbit to "+S.orbUpd.latest+"?"+(notes?"\n\n"+notes:"")+"\n\nOrbit will close, install the update and open again by itself."+(busy?"\n\nA game is running; it will be closed too. Save your world first.":"")))return;
  S.updBusy=true;topbar();
  try{await api("/update/install","POST",{})}catch(e){S.updBusy=false;topbar();toast(e.message,8000)}
}
async function checkUpdate(quiet){
  try{
    const i=await api("/update/info");
    if(i.last_error)toast("The last update didn't finish; the old version was kept. "+i.last_error,12000);
    if(!i.updater)return null;
    const r=await api("/update/check","POST",{});
    S.orbUpd=r.available?r:null;topbar();return r;
  }catch(e){if(!quiet)throw e;return null}
}
function pAbout(p){
  p.innerHTML=`<h3>Orbit</h3><div class="d">An unofficial, Modrinth-style instance and content manager for Modrinth and CurseForge. Not affiliated with Modrinth, CurseForge or Mojang. Everything stays on this computer.</div><div class="note">Settings file and default instances live in your Orbit app-data folder.</div>
  <h3 style="margin-top:22px">Updates</h3><div class="d" id="upv">Checking this version...</div>
  <div class="gap" style="justify-content:flex-start;margin-top:8px"><button class="btn brand" id="upc">${ic("refresh","sm")}Check for updates</button><button class="btn" id="upi" style="display:none">${ic("dl","sm")}Update now</button></div>
  <div class="note" id="ups" style="margin-top:10px;display:none"></div>`;
  const msg=(t,err)=>{const e=$("#ups");e.style.display=t?"":"none";e.textContent=t||"";e.style.whiteSpace="pre-wrap";e.style.color=err?"var(--red,#ff6b6b)":""};
  api("/update/info").then(i=>{
    $("#upv").textContent="Version "+i.version+(i.updater?"":" · updates aren't available in this install (orbit-updater is missing)");
    if(!i.updater)$("#upc").disabled=true;
    if(i.last_error)msg("The last update didn't finish, and the old version was kept:\n"+i.last_error,true);
  }).catch(()=>{$("#upv").textContent=""});
  $("#upc").onclick=async()=>{
    const b=$("#upc");b.disabled=true;$("#upi").style.display="none";msg("");const old=b.innerHTML;b.innerHTML='<span class="spin"></span>Checking...';
    try{
      const r=await checkUpdate(false);
      if(r&&r.available){
        msg("Orbit "+r.latest+" is available (you have "+r.current+")."+(r.notes?"\n\n"+r.notes.split("\n").slice(0,12).join("\n"):""));
        $("#upi").style.display="";
      }else if(r)msg("Orbit is up to date ("+r.current+").");
    }catch(e){msg(e.message,true)}
    b.innerHTML=old;b.disabled=false;
  };
  $("#upi").onclick=()=>startUpdate();
}

(async()=>{try{S.tasks=(await api("/tasks")).tasks.map(t=>t.status==="running"?{...t,status:"error",sub:"Interrupted"}:t)}catch(e){}try{S.settings=await api("/settings");applyLook()}catch(e){}reportTz();setInterval(reportTz,15*60*1000);load("home");pollRun();checkUpdate(true);setInterval(()=>checkUpdate(true),6*60*60*1000)})();
</script></body></html>
