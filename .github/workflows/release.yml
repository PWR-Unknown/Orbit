# Publishes a GitHub Release when you push a version tag (e.g. v0.3.0). Orbit's in-app "Update" button reads that release.
#   1. bump `version` in Cargo.toml (must equal the tag without the "v")
#   2. git commit -am "Release 0.3.0" && git tag v0.3.0 && git push && git push --tags
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  # Baked into orbit-updater, so release builds know where to look without shipping an updater.json.
  ORBIT_UPDATE_SOURCE: github:${{ github.repository }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo.toml says $v but the tag is ${{ github.ref_name }}" }
          "VER=$v" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\orbit.exe, target\release\orbit-updater.exe dist\
          Compress-Archive -Path dist\orbit.exe, dist\orbit-updater.exe -DestinationPath dist\Orbit-windows.zip -Force
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VER installer\orbit.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Orbit-windows.zip
            dist/Orbit-Setup.exe
          generate_release_notes: true

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: sh build_linux.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Orbit-linux.tar.gz
