[package]
name = "orbit"
version = "0.3.1"
edition = "2021"

[[bin]]
name = "orbit"
path = "src/main.rs"

[[bin]]
name = "orbit-updater"
path = "src/bin/orbit-updater.rs"

[features]
default = ["gui"]
# The native window + file dialogs. Build with --no-default-features for a headless server
# (prints the local URL; handy for testing the API with curl).
gui = ["dep:tao", "dep:wry", "dep:rfd"]

[dependencies]
tao = { version = "0.30", optional = true }
wry = { version = "0.47", optional = true }
rfd = { version = "0.15", optional = true }
tiny_http = "0.12"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
regex = "1"
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }   # mods.toml / neoforge.mods.toml
tar = { version = "0.4", default-features = false }                          # the standalone updater (orbit-updater) reads .tar.gz releases
serde_yaml = "0.9"                                                           # plugin.yml / paper-plugin.yml

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "unwind"   # a panic in one request handler must not take the app down
